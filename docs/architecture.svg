<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1200" width="1640" height="1200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .lane { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; rx:14 }
      .laneA { fill:#f0fdfa; stroke:#5eead4; stroke-width:1.5; rx:14 }
      .laneB { fill:#faf5ff; stroke:#d8b4fe; stroke-width:1.5; rx:14 }
      .laneDark { fill:#0f172a; stroke:#0f172a; stroke-width:1.5; rx:14 }
      .laneTitle { font-size:13px; font-weight:700; fill:#64748b; letter-spacing:1.4px }
      .box { rx:10; stroke-width:1.5 }
      .h { font-size:15px; font-weight:700; fill:#0f172a }
      .s { font-size:12px; fill:#475569 }
      .t { font-size:11px; fill:#64748b }
      .pill { font-size:10.5px; font-weight:700; letter-spacing:.4px }
      .edge { fill:none; stroke:#64748b; stroke-width:1.8; marker-end:url(#arr) }
      .edgeW { fill:none; stroke:#0f766e; stroke-width:2; marker-end:url(#arrW) }
      .edgeP { fill:none; stroke:#7c3aed; stroke-width:2; marker-end:url(#arrP) }
      .lbl { font-size:11px; fill:#475569; font-weight:600 }
    </style>
  </defs>

  <rect width="1640" height="1200" fill="#ffffff"/>

  <text x="48" y="54" font-size="27" font-weight="800" fill="#0f172a">Supplier Risk Buddy — multi-agent architecture</text>
  <text x="48" y="80" font-size="14" fill="#64748b">vibeLabs · Nebius hackathon · Siemens “Smart Supplier Selection for Trains”. Two specialist agents behind one chat switch; every model call goes to Nebius Token Factory.</text>

  <!-- ============ BROWSER LANE ============ -->
  <rect class="lane" x="48" y="104" width="1544" height="128"/>
  <text class="laneTitle" x="66" y="128">BROWSER — web/ :3000 · Next.js 16 + CopilotKit v2</text>
  <rect class="box" x="70" y="140" width="250" height="76" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="h" x="86" y="166">ChatPane</text>
  <text class="s" x="86" y="186">One thread, streamed tokens,</text>
  <text class="s" x="86" y="203">live activity + sources</text>

  <rect class="box" x="338" y="140" width="226" height="76" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="h" x="354" y="166">AgentSwitch</text>
  <text class="s" x="354" y="186">Data ⇄ Research</text>
  <text class="t" x="354" y="203">picks the active agent id</text>

  <rect class="box" x="582" y="140" width="300" height="76" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="h" x="598" y="166">Supplier Workspace / Dashboard</text>
  <text class="s" x="598" y="186">10k-row table, filters, favourites,</text>
  <text class="s" x="598" y="203">compare tray, comparison cards</text>

  <rect class="box" x="900" y="140" width="300" height="76" fill="#ecfeff" stroke="#67e8f9"/>
  <text class="h" x="916" y="166">Frontend tools (AG-UI)</text>
  <text class="s" x="916" y="186">CompareSuppliersTool · ShowNoticeTool</text>
  <text class="t" x="916" y="203">agent run pauses until the browser answers</text>

  <rect class="box" x="1218" y="140" width="352" height="76" fill="#faf5ff" stroke="#d8b4fe"/>
  <text class="h" x="1234" y="166">Research progress UI</text>
  <text class="s" x="1234" y="186">steps per lane, clarifier prompts,</text>
  <text class="s" x="1234" y="203">source list, typed risk report panel</text>

  <!-- ============ RUNTIME LANE ============ -->
  <rect class="lane" x="48" y="276" width="1544" height="104"/>
  <text class="laneTitle" x="66" y="300">ORCHESTRATION — server-side route  /api/copilotkit  (the browser never talks to an agent directly)</text>
  <rect class="box" x="70" y="312" width="1500" height="54" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="h" x="90" y="336">CopilotKit Runtime · InMemoryAgentRunner</text>
  <text class="s" x="90" y="355">Agent registry — routes the active agent id to its own runtime, keeps thread state, fans tool calls back to the browser</text>
  <rect x="1050" y="322" width="230" height="34" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text class="pill" x="1065" y="344" fill="#0f766e">data_buddy → HttpAgent (AG-UI)</text>
  <rect x="1296" y="322" width="256" height="34" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="pill" x="1311" y="344" fill="#7c3aed">research_buddy → LangGraphAgent</text>

  <!-- vertical edges browser -> runtime -->
  <path class="edge" d="M195,216 L195,312"/>
  <path class="edge" d="M451,216 L451,312"/>
  <path class="edge" d="M732,216 L732,312"/>
  <path class="edge" d="M1050,312 L1050,216"/>
  <path class="edge" d="M1394,312 L1394,216"/>
  <text class="lbl" x="205" y="268">HTTP / SSE</text>
  <text class="lbl" x="1060" y="268">tool calls ↑ results ↓</text>

  <!-- ============ AGENT A ============ -->
  <rect class="laneA" x="48" y="424" width="744" height="652"/>
  <text class="laneTitle" x="66" y="448" fill="#0f766e">AGENT A — agent/ :8000 · FastAPI + ag-ui-adk (Google ADK)</text>

  <rect class="box" x="70" y="462" width="700" height="112" fill="#ffffff" stroke="#14b8a6"/>
  <text class="h" x="88" y="488">Data Buddy — LlmAgent  /data</text>
  <text class="s" x="88" y="509">Answers questions about the 10,000-supplier dataset and drives the dashboard.</text>
  <text class="t" x="88" y="528">before_model_callback: hide_notice_unless_asked · slim_card_results</text>
  <text class="t" x="88" y="545">tools: dataset_info · SkillToolset(EAGER) · AGUIToolset</text>
  <rect x="88" y="552" width="330" height="16" rx="4" fill="none" stroke="none"/>
  <rect x="560" y="470" width="196" height="26" rx="7" fill="#ccfbf1" stroke="#14b8a6"/>
  <text class="pill" x="572" y="488" fill="#0f766e">Nemotron 3.5 Lightning · low</text>

  <rect class="box" x="70" y="596" width="340" height="106" fill="#ffffff" stroke="#14b8a6"/>
  <text class="h" x="88" y="622">Skill: supplier-comparison-cards</text>
  <text class="s" x="88" y="642">SKILL.md procedure + references,</text>
  <text class="s" x="88" y="659">loaded eagerly into the system prompt.</text>
  <text class="t" x="88" y="680">LLM only fills the arguments.</text>

  <rect class="box" x="430" y="596" width="340" height="106" fill="#ffffff" stroke="#14b8a6"/>
  <text class="h" x="448" y="622">Tool: compare_suppliers</text>
  <text class="s" x="448" y="642">intent · direction · mentions ·</text>
  <text class="s" x="448" y="659">supplier_ids / tray / rank_by+limit</text>
  <text class="t" x="448" y="680">one card per turn (invocation cache)</text>

  <rect class="box" x="70" y="724" width="700" height="150" fill="#ffffff" stroke="#14b8a6"/>
  <text class="h" x="88" y="750">Deterministic card engine  (buddy/cards)</text>
  <text class="s" x="88" y="769">No model in the loop past argument-filling — numbers can only come from the data.</text>
  <g font-size="11.5" font-weight="700" fill="#0f766e">
    <rect x="88" y="784" width="88" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="104" y="804">validate</text>
    <rect x="184" y="784" width="78" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="203" y="804">route</text>
    <rect x="270" y="784" width="78" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="288" y="804">select</text>
    <rect x="356" y="784" width="74" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="374" y="804">facts</text>
    <rect x="438" y="784" width="74" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="455" y="804">build</text>
    <rect x="520" y="784" width="104" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="536" y="804">composite</text>
    <rect x="632" y="784" width="90" height="30" rx="7" fill="#f0fdfa" stroke="#5eead4"/><text x="650" y="804">summary</text>
  </g>
  <text class="t" x="88" y="838">Ambiguous phrase (“financial risk”) → needs_choice: the buyer is asked which metric, never guessed.</text>
  <text class="lbl" x="560" y="856">card JSON → browser ↑</text>
  <text class="t" x="88" y="856">Thread memory: earlier card supplier lists resolve “these”, “the top three of them”.</text>

  <rect class="box" x="70" y="896" width="340" height="86" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="88" y="922">data/Siemens.csv</text>
  <text class="s" x="88" y="942">10,000 anonymised suppliers,</text>
  <text class="s" x="88" y="959">~40 risk &amp; performance metrics</text>

  <rect class="box" x="430" y="896" width="340" height="86" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text class="h" x="448" y="922">Research Buddy (ADK)  /research</text>
  <text class="s" x="448" y="942">Stub endpoint kept for the switch;</text>
  <text class="s" x="448" y="959">live research runs on Agent B →</text>

  <path class="edgeW" d="M240,574 L240,596"/>
  <path class="edgeW" d="M410,649 L430,649"/>
  <path class="edgeW" d="M600,702 L600,724"/>
  <path class="edgeW" d="M240,874 L240,896"/>

  <!-- ============ AGENT B ============ -->
  <rect class="laneB" x="820" y="424" width="772" height="652"/>
  <text class="laneTitle" x="838" y="448" fill="#7c3aed">AGENT B — agent/ :8123 · TypeScript LangGraph API server · graph research_agent</text>

  <rect class="box" x="842" y="462" width="728" height="68" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="860" y="488">Research Buddy — deep supplier-risk research over the open web</text>
  <text class="t" x="860" y="510">orchestrator: Nemotron 3.5 Super-VL (plans + writes)   ·   workers: Nemotron 3.5 Lightning (extract lane findings)   ·   persistence from the LangGraph server</text>

  <!-- graph nodes -->
  <rect class="box" x="842" y="552" width="150" height="58" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="858" y="576">orchestrate</text>
  <text class="t" x="858" y="594">company? focus?</text>

  <rect class="box" x="842" y="634" width="150" height="76" fill="#fff7ed" stroke="#fb923c"/>
  <text class="h" x="858" y="658">interrupt</text>
  <text class="s" x="858" y="677">clarifiers:</text>
  <text class="t" x="858" y="694">3 options, human picks</text>

  <rect class="box" x="1024" y="552" width="150" height="58" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="1040" y="576">build_plan</text>
  <text class="t" x="1040" y="594">4-lane plan → chat</text>

  <rect class="box" x="1206" y="540" width="364" height="212" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="1224" y="566">research — four lanes in parallel</text>
  <text class="t" x="1224" y="584">Promise.all · each lane searches, pivots once, extracts findings</text>
  <g>
    <rect x="1224" y="596" width="160" height="42" rx="8" fill="#faf5ff" stroke="#c084fc"/>
    <text x="1238" y="613" font-size="12.5" font-weight="700" fill="#6b21a8">financial</text>
    <text x="1238" y="630" class="t">liquidity, credit, bankruptcy</text>
    <rect x="1396" y="596" width="160" height="42" rx="8" fill="#faf5ff" stroke="#c084fc"/>
    <text x="1410" y="613" font-size="12.5" font-weight="700" fill="#6b21a8">esg</text>
    <text x="1410" y="630" class="t">governance, labor, strikes</text>
    <rect x="1224" y="648" width="160" height="42" rx="8" fill="#faf5ff" stroke="#c084fc"/>
    <text x="1238" y="665" font-size="12.5" font-weight="700" fill="#6b21a8">compliance</text>
    <text x="1238" y="682" class="t">fines, recalls, breaches</text>
    <rect x="1396" y="648" width="160" height="42" rx="8" fill="#faf5ff" stroke="#c084fc"/>
    <text x="1410" y="665" font-size="12.5" font-weight="700" fill="#6b21a8">news</text>
    <text x="1410" y="682" class="t">sentiment, geopolitics, 12mo</text>
  </g>
  <text class="t" x="1224" y="714">Shared search budget + domain allowlist — bounded cost, citable sources only.</text>
  <text class="t" x="1224" y="732">Every step emits an activity event → progress UI.</text>

  <rect class="box" x="1206" y="786" width="364" height="76" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="1224" y="812">red_flag_dives  (≤ 3)</text>
  <text class="s" x="1224" y="831">rank concrete red flags, re-search each for resolution;</text>
  <text class="t" x="1224" y="849">“looks resolved” → severity downgraded, not dropped</text>

  <rect class="box" x="1206" y="886" width="364" height="96" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="1224" y="912">synthesize</text>
  <text class="s" x="1224" y="931">Typed risk report: per-lane severity, red flags,</text>
  <text class="s" x="1224" y="948">overall assessment, every claim source-linked</text>
  <text class="t" x="1224" y="968">→ rendered in the report panel</text>

  <rect class="box" x="842" y="886" width="330" height="96" fill="#ffffff" stroke="#a855f7"/>
  <text class="h" x="860" y="912">follow_up  (budget 1 extra search)</text>
  <text class="s" x="860" y="931">Questions on a finished report answer</text>
  <text class="s" x="860" y="948">from state; only source/latest/confirm-</text>
  <text class="t" x="860" y="968">style asks spend a new search.</text>

  <rect class="box" x="842" y="760" width="330" height="104" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="h" x="860" y="786">Tavily Search API</text>
  <text class="s" x="860" y="806">web + news modes per lane,</text>
  <text class="s" x="860" y="823">allowlisted domains, dedup → sources</text>
  <text class="t" x="860" y="845">SearchBudgetError stops runaway runs</text>

  <!-- graph edges -->
  <path class="edgeP" d="M917,610 L917,634"/>
  <path class="edgeP" d="M992,581 L1024,581"/>
  <path class="edgeP" d="M1174,581 L1206,600"/>
  <path class="edgeP" d="M1388,752 L1388,786"/>
  <path class="edgeP" d="M1388,862 L1388,886"/>
  <path class="edgeP" d="M992,672 L1050,672 L1050,614" stroke-dasharray="5 4"/>
  <text class="lbl" x="1000" y="700">answers resume the run</text>
  <path class="edgeP" d="M1206,934 L1172,934"/>
  <text class="lbl" x="930" y="872">follow-up turn</text>
  <path class="edgeP" d="M1172,800 L1206,660" stroke-dasharray="5 4"/>
  <path class="edgeP" d="M1172,824 L1206,824" stroke-dasharray="5 4"/>

  <path class="edgeW" d="M1050,366 L1050,462" stroke="#7c3aed" marker-end="url(#arrP)"/>
  <path class="edgeW" d="M420,366 L420,462"/>
  <text class="lbl" x="430" y="412">AG-UI over SSE</text>
  <text class="lbl" x="1060" y="412">LangGraph streaming + interrupts</text>

  <!-- ============ MODEL LANE ============ -->
  <rect class="laneDark" x="48" y="1100" width="1544" height="76"/>
  <text class="laneTitle" x="66" y="1124" fill="#94a3b8">MODEL &amp; DATA PROVIDERS</text>
  <text x="66" y="1152" font-size="15" font-weight="700" fill="#ffffff">Nebius Token Factory — OpenAI-compatible  ·  api.tokenfactory.nebius.com/v1</text>
  <text x="66" y="1169" font-size="12" fill="#cbd5e1">Agent A via LiteLLM (nebius/ provider, reasoning_effort through extra_body, one retry on a text-shaped tool call)   ·   Agent B via ChatOpenAI (streaming off, JSON-per-node)   ·   Tavily for web search</text>
  <path class="edgeW" d="M420,982 L420,1100" stroke="#5eead4" marker-end="url(#arrW)"/>
  <path class="edgeP" d="M1007,982 L1007,1100" stroke="#c084fc"/>
  <path class="edgeP" d="M1388,982 L1388,1100" stroke="#c084fc"/>
</svg>
