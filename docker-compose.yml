services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      NEBIUS_ORCHESTRATOR_MODEL: ${NEBIUS_ORCHESTRATOR_MODEL:-nvidia/Nemotron-3.5-Super-VL}
      NEBIUS_WORKER_MODEL: ${NEBIUS_WORKER_MODEL:-nvidia/Nemotron-3_5-Lightning}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    # Agent port stays private on the compose network — not published to the host.
    expose:
      - "8123"
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      AGENT_BASE_URL: http://agent:8000
      LANGGRAPH_DEPLOYMENT_URL: http://agent:8123
      NODE_ENV: production
    depends_on:
      - agent
    networks:
      - internal

networks:
  internal:
    driver: bridge
