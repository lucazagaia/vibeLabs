[project]
name = "vibelabs-agent"
version = "0.1.0"
description = "Buddy: ADK supervisor agent for the vibeLabs Siemens supplier-risk app"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-adk==0.10.*",
    "fastapi>=0.133,<1",
    "google-adk==2.12.*",
    "httpx>=0.28.1",
    "litellm==1.106.*",
    "mcp>=1.24,<3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
